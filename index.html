<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Comeback Project | Re-Entry & Workforce Support</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --dark: #111111;
  --card: #1a1a1a;
  --gold: #C9A84C;
  --gold-light: #e2c06a;
  --white: #ffffff;
  --gray: #aaaaaa;
  --border: #2a2a2a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--black); color: var(--white); font-family: 'Lato', sans-serif; }

nav {
  position: fixed; top: 0; width: 100%; z-index: 100;
  background: rgba(10,10,10,0.97); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 40px;
}
nav img.logo { height: 52px; width: auto; }
nav ul { list-style: none; display: flex; gap: 32px; }
nav ul a { color: var(--gray); text-decoration: none; font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; transition: color 0.2s; }
nav ul a:hover { color: var(--gold); }

#hero {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 120px 24px 80px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.85) 100%),
              url('dallas.png') center center / cover no-repeat;
  position: relative; overflow: hidden;
}
#hero::before {
  content: ''; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(201,168,76,0.03) 60px, rgba(201,168,76,0.03) 61px),
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(201,168,76,0.03) 60px, rgba(201,168,76,0.03) 61px);
}
.hero-tag { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 24px; position: relative; }
#hero h1 { font-family: 'Oswald', sans-serif; font-size: clamp(52px, 10vw, 100px); font-weight: 700; line-height: 1; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; position: relative; }
#hero h1 span { color: var(--gold); }
#hero p.subhead { font-size: 18px; color: var(--gray); max-width: 520px; line-height: 1.7; margin-bottom: 40px; font-weight: 300; font-style: italic; position: relative; }
.btn-gold {
  display: inline-block; background: var(--gold); color: var(--black);
  font-family: 'Oswald', sans-serif; font-size: 15px; letter-spacing: 3px;
  text-transform: uppercase; padding: 18px 48px; text-decoration: none;
  font-weight: 600; transition: background 0.2s, transform 0.2s; position: relative;
}
.btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); }
.btn-outline {
  display: inline-block; border: 1px solid var(--gold); color: var(--gold);
  font-family: 'Oswald', sans-serif; font-size: 15px; letter-spacing: 3px;
  text-transform: uppercase; padding: 17px 48px; text-decoration: none;
  font-weight: 600; transition: all 0.2s;
}
.btn-outline:hover { background: var(--gold); color: var(--black); }
.hero-badges { display: flex; gap: 48px; margin-top: 64px; flex-wrap: wrap; justify-content: center; position: relative; }
.badge { text-align: center; }
.badge-num { font-family: 'Oswald', sans-serif; font-size: 36px; color: var(--gold); font-weight: 700; }
.badge-label { font-size: 11px; letter-spacing: 2px; color: var(--gray); text-transform: uppercase; margin-top: 4px; }

section { padding: 90px 24px; }
.container { max-width: 1100px; margin: 0 auto; }
.section-label { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 16px; }
.section-title { font-family: 'Oswald', sans-serif; font-size: clamp(32px, 5vw, 52px); font-weight: 700; text-transform: uppercase; line-height: 1.1; margin-bottom: 20px; }
.divider { width: 60px; height: 3px; background: var(--gold); margin: 20px 0 40px; }

#mission { background: var(--dark); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
#mission p.body { font-size: 17px; line-height: 1.9; color: #cccccc; max-width: 740px; font-weight: 300; }
#mission blockquote { margin-top: 32px; border-left: 3px solid var(--gold); padding-left: 24px; font-family: 'Oswald', sans-serif; font-size: 22px; color: var(--gold-light); font-style: italic; }

#services { background: var(--black); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3px; margin-top: 40px; }
.card {
  position: relative; height: 280px; overflow: hidden;
  border-bottom: 3px solid transparent; transition: border-color 0.3s;
}
.card:hover { border-color: var(--gold); }
.card-bg {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  transition: transform 0.4s ease;
}
.card:hover .card-bg { transform: scale(1.05); }
.card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 40%, rgba(0,0,0,0.4) 100%);
}
.card-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 28px; }
.card-icon { font-size: 28px; margin-bottom: 10px; display: block; }
.card h3 { font-family: 'Oswald', sans-serif; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: var(--white); }
.card p { font-size: 13px; color: #ccc; line-height: 1.6; }

#involved { background: var(--dark); border-top: 1px solid var(--border); }
.involve-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 40px; }
.involve-card { background: var(--black); border: 1px solid var(--border); padding: 48px 36px; text-align: center; transition: border-color 0.2s; }
.involve-card:hover { border-color: var(--gold); }
.involve-card h3 { font-family: 'Oswald', sans-serif; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
.involve-card p { font-size: 14px; color: var(--gray); line-height: 1.7; margin-bottom: 28px; }

#contact { background: var(--black); border-top: 1px solid var(--border); }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 40px; }
.contact-item { margin-bottom: 28px; }
.contact-item label { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; display: block; margin-bottom: 8px; }
.contact-item a, .contact-item span { color: var(--white); text-decoration: none; font-size: 16px; }
.contact-item a:hover { color: var(--gold); }
.social-links { display: flex; gap: 20px; margin-top: 8px; }
.social-links a { color: var(--gray); font-size: 13px; letter-spacing: 1px; text-decoration: none; font-family: 'Oswald', sans-serif; text-transform: uppercase; transition: color 0.2s; }
.social-links a:hover { color: var(--gold); }

footer { background: #050505; border-top: 1px solid var(--border); padding: 32px 24px; text-align: center; }
footer p { font-size: 12px; color: #444; font-family: 'Oswald', sans-serif; letter-spacing: 2px; text-transform: uppercase; line-height: 2; }
footer span { color: var(--gold); }

@media (max-width: 768px) {
  nav { padding: 12px 20px; }
  nav ul { gap: 16px; }
  nav ul a { font-size: 11px; }
  .contact-grid { grid-template-columns: 1fr; gap: 0; }
  .hero-badges { gap: 24px; }
  nav img.logo { height: 40px; }
}
@media (max-width: 480px) {
  nav ul { display: none; }
}
</style>
</head>
<body>

  <ul>

    <li><a href="#services">What We Do</a></li>
    <li><a href="#involved">Get Involved</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>
